name: Test stylelint_ignore excludes files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/project
          stylelint_input: 'css/*.css'
          stylelint_ignore: 'css/bad.css'
          reporter: local
          filter_mode: nofilter
          fail_level: error
      - name: Assert action succeeded (bad.css ignored)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success since bad.css is ignored"
            exit 1
          fi
          echo "PASS"
