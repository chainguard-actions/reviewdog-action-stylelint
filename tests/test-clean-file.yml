name: Test clean file passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/project
          stylelint_input: 'css/good.css'
          reporter: local
          filter_mode: nofilter
          fail_level: error
      - name: Assert action succeeded and stylelint was installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ ! -d "$GITHUB_WORKSPACE/tests/fixtures/project/node_modules/stylelint" ]; then
            echo "FAIL: stylelint was not installed in workdir"
            exit 1
          fi
          echo "PASS"
