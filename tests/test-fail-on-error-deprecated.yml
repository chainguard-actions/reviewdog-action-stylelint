name: Test deprecated fail_on_error=true is accepted (fail_level takes precedence)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The script always passes -fail-level (default 'none') alongside the
      # deprecated -fail-on-error. reviewdog lets the explicit -fail-level win,
      # so with fail_level=none the run must still succeed even with lint errors.
      - id: action
        uses: .
        continue-on-error: true
        with:
          workdir: tests/fixtures/project
          stylelint_input: 'css/bad.css'
          reporter: local
          filter_mode: nofilter
          fail_level: none
          fail_on_error: 'true'
      - name: Assert deprecated input accepted and fail_level=none wins
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success (fail_level=none overrides deprecated fail_on_error)"
            exit 1
          fi
          echo "PASS"
      - name: Assert stylelint was installed in workdir
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/tests/fixtures/project/node_modules/stylelint" ]; then
            echo "FAIL: stylelint not installed in workdir"
            exit 1
          fi
          echo "PASS"
