name: Test stylelint with ignore pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stylelint dependencies
        run: npm install
        working-directory: pristine/reviewdog--action-stylelint/v1.31.0
        continue-on-error: true

      - id: action
        uses: .
        with:
          github_token: fake-token-for-local-testing
          stylelint_input: "**/*.css"
          stylelint_ignore: "node_modules/**"
          reporter: github-check
          filter_mode: nofilter
          level: error
          fail_level: none
          workdir: pristine/reviewdog--action-stylelint/v1.31.0
        continue-on-error: true

      - name: Assert action executed with ignore pattern (not skipped)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action executed with stylelint_ignore (outcome=${{ steps.action.outcome }})"
