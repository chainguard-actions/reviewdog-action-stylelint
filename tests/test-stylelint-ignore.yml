name: Test stylelint_ignore input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js and install stylelint
        run: |
          npm install --save-dev stylelint stylelint-config-standard

      - name: Create CSS files for testing
        run: |
          mkdir -p tests/fixtures/css-ignore
          # Clean CSS file that should pass
          cat > tests/fixtures/css-ignore/style.css << 'EOF'
          a { color: pink; }
          EOF
          # CSS file with an invalid hex that would fail if not ignored
          cat > tests/fixtures/css-ignore/bad.css << 'EOF'
          a { color: #gggggg; }
          EOF

      - name: Create stylelint config
        run: |
          cat > tests/fixtures/css-ignore/.stylelintrc.json << 'EOF'
          {
            "rules": {
              "color-no-invalid-hex": true
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          stylelint_input: "**/*.css"
          stylelint_config: "${{ github.workspace }}/tests/fixtures/css-ignore/.stylelintrc.json"
          stylelint_ignore: "bad.css"
          workdir: tests/fixtures/css-ignore

      - name: Assert action ran with stylelint_ignore input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with stylelint_ignore set (bad.css was ignored)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
