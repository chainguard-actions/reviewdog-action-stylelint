name: Test additional NPM packages input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up CSS file and stylelint config using standard config
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-pkgs"
          # Write a valid CSS file
          cat > "$GITHUB_WORKSPACE/test-pkgs/style.css" <<'EOF'
          a {
            color: red;
          }
          EOF
          # Write a stylelint config that extends stylelint-config-standard
          cat > "$GITHUB_WORKSPACE/test-pkgs/.stylelintrc.json" <<'EOF'
          {
            "extends": ["stylelint-config-standard"],
            "rules": {}
          }
          EOF
          # Write a package.json with stylelint as a dependency
          cat > "$GITHUB_WORKSPACE/test-pkgs/package.json" <<'EOF'
          {
            "name": "test-pkgs",
            "version": "1.0.0",
            "dependencies": {
              "stylelint": "^15.0.0"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          level: error
          fail_level: none
          packages: stylelint-config-standard
          stylelint_input: "**/*.css"
          workdir: test-pkgs

      - name: Assert action ran with additional packages
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with additional packages installed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
