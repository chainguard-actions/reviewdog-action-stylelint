name: Test custom report name and level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js and install stylelint
        run: |
          npm install --save-dev stylelint

      - name: Create a clean CSS file
        run: |
          mkdir -p tests/fixtures/css-named
          cat > tests/fixtures/css-named/main.css << 'EOF'
          body {
            margin: 0;
            padding: 0;
          }
          EOF
          cat > tests/fixtures/css-named/.stylelintrc.json << 'EOF'
          {
            "rules": {
              "color-no-invalid-hex": true
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          level: info
          name: my-custom-stylelint-check
          stylelint_input: "**/*.css"
          stylelint_config: "${{ github.workspace }}/tests/fixtures/css-named/.stylelintrc.json"
          workdir: tests/fixtures/css-named

      - name: Assert action ran with custom name and info level
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom name 'my-custom-stylelint-check' and level 'info'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
